<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass Tool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .box {
    width: 100%; max-width: 500px;
    background: #12121a; border-radius: 16px;
    padding: 24px; border: 1px solid #1f1f2e;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 1.4rem; text-align: center; margin-bottom: 6px;
    background: linear-gradient(135deg, #00e676, #29b6f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; font-size: .8rem; color: #666; margin-bottom: 20px; }
  label { display: block; font-size: .8rem; color: #aaa; margin-bottom: 8px; }
  input {
    width: 100%; padding: 14px 16px;
    background: #0a0a0f; border: 1px solid #2a2a3a;
    border-radius: 10px; color: #fff; font-size: .9rem;
    outline: none; font-family: monospace;
  }
  input:focus { border-color: #00e676; }
  button {
    width: 100%; padding: 14px; margin-top: 14px;
    background: linear-gradient(135deg, #00e676, #29b6f6);
    border: none; border-radius: 10px; color: #0a0a0f;
    font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .result {
    margin-top: 20px; padding: 14px;
    background: #0a0a0f; border-radius: 10px;
    border: 1px solid #1f1f2e;
    font-size: .82rem; line-height: 1.5;
    display: none; word-break: break-all;
  }
  .result.show { display: block; }
  .result .label { color: #888; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .result a { color: #00e676; text-decoration: none; font-weight: 600; }
  .result .copy {
    margin-top: 10px; padding: 8px 14px;
    background: #1f1f2e; color: #aaa;
    border: none; border-radius: 6px;
    font-size: .75rem; width: auto; cursor: pointer;
  }
  .error { color: #ff1744; }
  .success { color: #00e676; }
  .loading { color: #ffd700; }
  .footer { text-align: center; margin-top: 20px; font-size: .7rem; color: #444; }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #ffd700; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <h1>🔓 Bypass Tool</h1>
  <p class="sub">Vượt link rút gọn nhanh chóng</p>

  <label>Dán link rút gọn</label>
  <input id="url" type="text" placeholder="https://link4m.co/abc123..." autocomplete="off">

  <button id="btn" onclick="bypass()">🚀 Bypass ngay</button>

  <div id="res" class="result"></div>

  <div class="footer">Made with GitHub Pages</div>
</div>

<script>
async function bypass() {
  const url = document.getElementById('url').value.trim();
  const res = document.getElementById('res');
  const btn = document.getElementById('btn');

  if (!url) {
    res.className = 'result show';
    res.innerHTML = '<span class="error">⚠️ Vui lòng nhập link</span>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Đang xử lý...';
  res.className = 'result show';
  res.innerHTML = '<span class="loading">⏳ Đang bypass, vui lòng chờ...</span>';

  // Thử lần lượt nhiều API để tăng tỉ lệ thành công
  const apis = [
    { name: 'bypass.vip', url: 'https://api.bypass.vip/bypass?url=' },
    { name: 'bypass.city', url: 'https://api.bypass.city/bypass?url=' }
  ];

  let lastError = 'Không có API nào phản hồi';
  for (const api of apis) {
    try {
      const r = await fetch(api.url + encodeURIComponent(url));
      if (!r.ok) { lastError = 'HTTP ' + r.status; continue; }
      const data = await r.json();
      const finalUrl = data.result || data.url || data.destination;
      if (finalUrl) {
        res.innerHTML =
          '<div class="label">✅ Link gốc</div>' +
          '<a href="' + finalUrl + '" target="_blank">' + finalUrl + '</a>' +
          '<button class="copy" onclick="copy(\'' + finalUrl.replace(/'/g, "\\'") + '\')">📋 Copy</button>' +
          '<div style="margin-top:8px;font-size:.7rem;color:#666;">API: ' + api.name + '</div>';
        btn.disabled = false;
        btn.innerHTML = '🚀 Bypass ngay';
        return;
      }
    } catch (e) {
      lastError = e.message;
    }
  }

  res.innerHTML = '<span class="error">❌ Không bypass được: ' + lastError + '</span>';
  btn.disabled = false;
  btn.innerHTML = '🚀 Bypass ngay';
}

function copy(text) {
  navigator.clipboard.writeText(text).then(() => {
    const res = document.getElementById('res');
    const old = res.innerHTML;
    res.innerHTML = '<span class="success">✅ Đã copy vào clipboard!</span>';
    setTimeout(() => { res.innerHTML = old; }, 1500);
  });
}

// Cho phép nhấn Enter để bypass
document.getElementById('url').addEventListener('keypress', e => {
  if (e.key === 'Enter') bypass();
});
</script>
</body>
</html>
