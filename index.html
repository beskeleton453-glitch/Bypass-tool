<script>
let currentMode = 'ask';
let currentGist = null;

function toast(msg){
  const e=document.createElement('div');
  e.className='toast'; e.textContent=msg;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),3000);
}
function setMode(m){
  currentMode = m;
  document.querySelectorAll('.mode').forEach(e=>e.classList.toggle('active', e.dataset.mode===m));
  document.getElementById('keyCard').style.display = (m === 'none') ? 'none' : 'block';
}
function genKey(){
  const c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s='';
  for(let i=0;i<24;i++)s+=c[Math.floor(Math.random()*c.length)];
  document.getElementById('key').value = s;
}
function saveToken(){
  const t = document.getElementById('token').value.trim();
  if(!t){ toast('Chưa nhập'); return; }
  if(!t.startsWith('ghp_') && !t.startsWith('github_pat_')){ toast('Token sai'); return; }
  localStorage.setItem('ghToken', t);
  toast('Đã lưu');
  updateTokenInfo();
}
function clearToken(){
  localStorage.removeItem('ghToken');
  document.getElementById('token').value = '';
  updateTokenInfo();
}
function updateTokenInfo(){
  const t = localStorage.getItem('ghToken');
  const el = document.getElementById('tokenInfo');
  if(t){
    el.innerHTML = '✅ Đã lưu: <b>' + t.substring(0,12) + '...</b>';
    el.style.color = '#00e676';
    document.getElementById('token').value = t;
  } else {
    el.textContent = 'Chưa có token.';
    el.style.color = '#666';
  }
}
function loadFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('code').value = ev.target.result;
    updateSize();
    toast('Đã tải file');
  };
  r.readAsText(f);
}
function clearCode(){
  document.getElementById('code').value = '';
  updateSize();
}
function updateSize(){
  const len = document.getElementById('code').value.length;
  document.getElementById('sizeInfo').textContent = len > 0 ? len.toLocaleString('vi-VN') + ' ký tự' : 'Chưa có code';
}

/* ===== CRYPTO ===== */
function deriveKeyTable(masterKey){
  const table = new Uint8Array(256);
  for(let i = 0; i < 256; i++){
    let h = i;
    for(let j = 0; j < masterKey.length; j++){
      h = (h * 31 + (masterKey.charCodeAt(j) & 0xFF) + j) & 0xFF;
    }
    table[i] = h;
  }
  return table;
}
function strToBytes(str){
  const bytes=[];
  for(let i=0;i<str.length;i++){
    const cc=str.charCodeAt(i);
    if(cc<0x80)bytes.push(cc);
    else if(cc<0x800){bytes.push(0xC0|(cc>>6));bytes.push(0x80|(cc&0x3F));}
    else if(cc<0xD800||cc>=0xE000){bytes.push(0xE0|(cc>>12));bytes.push(0x80|((cc>>6)&0x3F));bytes.push(0x80|(cc&0x3F));}
    else{i++;const c2=str.charCodeAt(i);const cp=0x10000+((cc-0xD800)<<10)+(c2-0xDC00);
      bytes.push(0xF0|(cp>>18));bytes.push(0x80|((cp>>12)&0x3F));bytes.push(0x80|((cp>>6)&0x3F));bytes.push(0x80|(cp&0x3F));}
  }
  return bytes;
}
function encryptBytes(plainBytes, key){
  const MAGIC = [75,76,80,51,10];
  const data = MAGIC.concat(plainBytes);
  const table = deriveKeyTable(key);
  const out = new Uint8Array(data.length);
  let prev = 0, prev2 = 0;
  for(let i=0;i<data.length;i++){
    const b = data[i];
    const k = table[i & 0xFF];
    let e = b ^ k;
    e = (e + (i & 0xFF)) & 0xFF;
    e = e ^ prev;
    e = e ^ ((prev2 * 7 + 13) & 0xFF);
    out[i] = e;
    prev2 = prev;
    prev = e;
  }
  return out;
}
function bytesToBase64(bytes){
  let bin='';
  const CHUNK=8192;
  for(let i=0;i<bytes.length;i+=CHUNK){
    bin += String.fromCharCode.apply(null, Array.prototype.slice.call(bytes, i, i+CHUNK));
  }
  return btoa(bin);
}

/* ===== LUA DECODE CODE ===== */
function luaDecodeCode(){
  return `local __b64map={}
local __b64chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
for i=1,#__b64chars do __b64map[__b64chars:sub(i,i)]=i-1 end
local function __b64decode(s)
  s=s:gsub("[^A-Za-z0-9+/=]","")
  local out={}
  local i=1
  while i<=#s do
    local a=__b64map[s:sub(i,i)] or 0
    local b=__b64map[s:sub(i+1,i+1)] or 0
    local c=__b64map[s:sub(i+2,i+2)] or 0
    local d=__b64map[s:sub(i+3,i+3)] or 0
    local n=a*262144+b*4096+c*64+d
    out[#out+1]=string.char(math.floor(n/65536)%256)
    if s:sub(i+2,i+2)~="=" then out[#out+1]=string.char(math.floor(n/256)%256) end
    if s:sub(i+3,i+3)~="=" then out[#out+1]=string.char(n%256) end
    i=i+4
  end
  return table.concat(out)
end
local function __deriveTable(masterKey)
  local t={}
  for i=0,255 do
    local h=i
    for j=1,#masterKey do
      h=(h*31+masterKey:byte(j)+(j-1))%256
    end
    t[i+1]=h
  end
  return t
end
local function __decrypt(enc,masterKey)
  local tbl=__deriveTable(masterKey)
  local out={}
  local prev=0
  local prev2=0
  for i=1,#enc do
    local e=enc:byte(i)
    local idx=bit32.band(i-1,255)
    local k=tbl[idx+1]
    local x=bit32.bxor(e,prev)
    x=bit32.bxor(x,bit32.band(prev2*7+13,255))
    local b=bit32.band(x-(i-1),255)
    local v=bit32.bxor(b,k)
    out[i]=string.char(v)
    prev2=prev
    prev=e
  end
  return table.concat(out)
end`;
}

local __busy = false
local __lastTried = ""
local function submit()
    local k = InputBox.Text
    if k == "" then
        setStatus("⚠  Vui lòng nhập key", Color3.fromRGB(255, 180, 80))
        return
    end
    if __busy then return end
    if k == __lastTried then return end
    __lastTried = k
    __busy = true
    setStatus("⏳ Đang xác thực...", Color3.fromRGB(150, 200, 255))
    task.wait(0.1)

    -- ADMIN KEY
    if k == ADMIN_KEY then
        setStatus("⚙  Admin access — opening panel...", Color3.fromRGB(255, 200, 100))
        task.wait(0.5)
        __busy = false
        openAdminPanel()
        return
    end

    -- Normal decrypt
    local ok, data = pcall(__decrypt, __enc, k)
    if not ok or not data or data:sub(1, 5) ~= "KLP3\\n" then
        setStatus("✕  Key không hợp lệ", Color3.fromRGB(255, 90, 100))

        end
        TweenService:Create(InputFrame, TweenInfo.new(0.08), {Position = orig}):Play()
        __busy = false
        __lastTried = ""
        return
    end

    setStatus("✦  Access granted — Loading...", Color3.fromRGB(100, 255, 150))
    InputStroke.Color = Color3.fromRGB(100, 255, 150)
    task.wait(0.9)
    closeKeyUI()
    task.wait(0.3)
    runDecoded(data)
    __busy = false
end

/* ===== GITHUB API ===== */
async function createGist(content, filename){
  const token = localStorage.getItem('ghToken');
  if(!token) throw new Error('Chưa có token');
  const body = { description: 'Gist Loader', public: false, files: {} };
  body.files[filename] = { content: content };
  const r = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    if(r.status === 401) throw new Error('Token sai/hết hạn');
    if(r.status === 403) throw new Error('Token thiếu quyền gist');
    throw new Error('GitHub ' + r.status);
  }
  const data = await r.json();
  return {
    id: data.id,
    rawUrl: data.files[filename].raw_url,
    gistUrl: data.html_url,
    filename: filename
  };
}

async function updateGist(gistId, filename, content){
  const token = localStorage.getItem('ghToken');
  if(!token) throw new Error('Chưa có token');
  const body = { files: {} };
  body.files[filename] = { content: content };
  const r = await fetch('https://api.github.com/gists/' + gistId, {
    method: 'PATCH',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    if(r.status === 404) throw new Error('Gist không tồn tại');
    if(r.status === 401) throw new Error('Token sai');
    throw new Error('GitHub ' + r.status);
  }
  const data = await r.json();
  return {
    rawUrl: data.files[filename].raw_url,
    gistUrl: data.html_url
  };
}

/* ===== HISTORY ===== */
function getHistory(){
  try { return JSON.parse(localStorage.getItem('glpHistory') || '[]'); }
  catch { return []; }
}
function setHistory(h){
  localStorage.setItem('glpHistory', JSON.stringify(h));
  renderHistory();
}
function saveHistory(item){
  const h = getHistory();
  const idx = h.findIndex(x => x.id === item.id);
  if(idx >= 0) h[idx] = item;
  else h.unshift(item);
  if(h.length > 30) h.length = 30;
  setHistory(h);
}
function renderHistory(){
  const h = getHistory();
  const el = document.getElementById('historyList');
  document.getElementById('histCount').textContent = h.length > 0 ? '(' + h.length + ')' : '';
  if(h.length === 0){
    el.innerHTML = '<div class="empty">Chưa có gì.</div>';
    return;
  }
  el.innerHTML = h.map((item, idx) => {
    const badgeClass = item.mode === 'ask' ? 'badge-ask' : (item.mode === 'embed' ? 'badge-embed' : 'badge-none');
    const badgeText = item.mode === 'ask' ? 'HỎI KEY' : (item.mode === 'embed' ? 'NHÚNG KEY' : 'KHÔNG KHÓA');
    const keyLine = item.key ? '<div class="hist-key">🔑 ' + item.key + '</div>' : '';
    return '<div class="hist-item">' +
      '<div class="hist-head">' +
        '<span class="hist-time">' + item.time + '</span>' +
        '<span class="hist-badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      '<div style="font-size:.68rem;color:#888;">📦 ' + (item.scriptSize || 0).toLocaleString('vi-VN') + ' ký tự</div>' +
      keyLine +
      '<div class="hist-url">🔗 ' + (item.rawUrl || '').substring(0, 60) + '...</div>' +
      '<div class="hist-actions">' +
        '<button class="small green" onclick="loadHistItem(' + idx + ')">📥 Load</button>' +
        '<button class="small blue" onclick="updateHistItem(' + idx + ')">♻️ Update</button>' +
        '<button class="small gray" onclick="copyHistLoader(' + idx + ')">📋 Copy</button>' +
        '<button class="small red" onclick="deleteHistItem(' + idx + ')">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
function loadHistItem(idx){
  const h = getHistory();
  const item = h[idx];
  if(!item) return;
  document.getElementById('code').value = item.script || '';
  document.getElementById('key').value = item.key || '';
  setMode(item.mode || 'ask');
  updateSize();
  toast('Đã load script + key + mode');
  window.scrollTo({top: 0, behavior: 'smooth'});
}
async function updateHistItem(idx){
  const h = getHistory();
  const item = h[idx];
  if(!item) return;
  if(!item.id){ toast('Gist cũ không có ID'); return; }
  const currentCode = document.getElementById('code').value.trim();
  if(!currentCode){ toast('Chưa có code'); return; }
  if(!confirm('Update gist ' + item.id.substring(0,8) + '?\n(URL giữ nguyên)')) return;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    let uploadContent;
    let key = '';
    if(currentMode === 'none'){
      uploadContent = currentCode;
    } else {
      key = document.getElementById('key').value.trim();
      if(!key){ toast('Cần nhập key'); btn.disabled=false; btn.textContent='♻️ Update'; return; }
      if(key.length < 6){ toast('Key từ 6 ký tự'); btn.disabled=false; btn.textContent='♻️ Update'; return; }
      const plainBytes = strToBytes(currentCode);
      const encBytes = encryptBytes(plainBytes, key);
      const b64 = bytesToBase64(encBytes);
      uploadContent = buildFullLoader(b64, key, currentMode);
    }
    const result = await updateGist(item.id, item.filename, uploadContent);
    const h2 = getHistory();
    h2[idx].script = currentCode;
    h2[idx].key = key;
    h2[idx].mode = currentMode;
    h2[idx].scriptSize = currentCode.length;
    h2[idx].time = new Date().toLocaleString('vi-VN');
    h2[idx].rawUrl = result.rawUrl;
    setHistory(h2);
    toast('✅ Đã update gist!');
  } catch(e){
    toast('❌ ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = '♻️ Update';
}
function copyHistLoader(idx){
  const h = getHistory();
  const item = h[idx];
  if(!item) return;
  const loader = 'loadstring(game:HttpGet("' + item.rawUrl + '"))()';
  navigator.clipboard.writeText(loader).then(() => toast('Đã copy!'));
}
function deleteHistItem(idx){
  const h = getHistory();
  if(!h[idx]) return;
  if(!confirm('Xóa mục này?')) return;
  h.splice(idx, 1);
  setHistory(h);
  toast('Đã xóa');
}
function clearHistory(){
  if(!confirm('Xóa TOÀN BỘ lịch sử?')) return;
  localStorage.removeItem('glpHistory');
  renderHistory();
  toast('Đã xóa hết');
}
function exportHistory(){
  const h = getHistory();
  if(h.length === 0){ toast('Trống'); return; }
  const blob = new Blob([JSON.stringify(h, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gist_loader_history_' + Date.now() + '.json';
  a.click();
  toast('Đã export ' + h.length + ' items');
}
function importHistory(){
  document.getElementById('importFile').click();
}
function handleImport(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if(!Array.isArray(imported)) throw new Error('Sai format');
      const existing = getHistory();
      const merged = [...existing];
      for(const item of imported){
        if(!item.id) continue;
        const idx = merged.findIndex(x => x.id === item.id);
        if(idx >= 0){
          if(item.time > merged[idx].time) merged[idx] = item;
        } else {
          merged.push(item);
        }
      }
      merged.sort((a, b) => (b.time || '').localeCompare(a.time || ''));
      if(merged.length > 30) merged.length = 30;
      setHistory(merged);
      toast('✅ Import ' + imported.length + ' items');
    } catch(err){
      toast('❌ File JSON sai');
    }
  };
  r.readAsText(f);
  e.target.value = '';
}

/* ===== MAIN ===== */
async function gen(){
  const raw = document.getElementById('code').value;
  if(!raw.trim()){ toast('Chưa có code'); return; }
  const token = localStorage.getItem('ghToken');
  if(!token){ toast('Chưa lưu token'); return; }

  let key = '';
  if(currentMode !== 'none'){
    key = document.getElementById('key').value.trim();
    if(!key){ key = 'KLP' + Math.random().toString(36).substring(2, 20); document.getElementById('key').value = key; }
    if(key.length < 6){ toast('Key từ 6 ký tự'); return; }
  }

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang xử lý...';

  try {
    await new Promise(r => setTimeout(r, 30));
    const rand = Math.random().toString(36).substring(2, 15);
    let uploadContent, filename;

    if(currentMode === 'none'){
      uploadContent = raw;
      filename = 'script_' + rand + '.lua';
    } else {
      const plainBytes = strToBytes(raw);
      const encBytes = encryptBytes(plainBytes, key);
      const b64 = bytesToBase64(encBytes);
      uploadContent = buildFullLoader(b64, key, currentMode);
      filename = 'loader_' + rand + '.lua';
    }

    btn.textContent = '⏳ Đang upload Gist...';
    const gist = await createGist(uploadContent, filename);
    currentGist = gist.gistUrl;

    const loadstringLine = 'loadstring(game:HttpGet("' + gist.rawUrl + '"))()';
    document.getElementById('loader').textContent = loadstringLine;
    document.getElementById('res').classList.add('show');

    if(currentMode !== 'none'){
      document.getElementById('keyOutLbl').style.display = 'block';
      document.getElementById('keyOut').style.display = 'block';
      document.getElementById('keyOut').textContent = key;
    } else {
      document.getElementById('keyOutLbl').style.display = 'none';
      document.getElementById('keyOut').style.display = 'none';
    }

    saveHistory({
      id: gist.id,
      filename: gist.filename,
      rawUrl: gist.rawUrl,
      gistUrl: gist.gistUrl,
      key: key,
      mode: currentMode,
      script: raw,
      scriptSize: raw.length,
      time: new Date().toLocaleString('vi-VN')
    });

    const modeName = currentMode === 'none' ? 'Không khóa' : (currentMode === 'ask' ? 'Hỏi key (Neon UI)' : 'Nhúng key');
    document.getElementById('stat').innerHTML = '📊 ' + raw.length.toLocaleString('vi-VN') + ' ký tự · Mode: <b>' + modeName + '</b>';
    toast('✅ Xong! Copy dòng xanh');
  } catch(e){
    toast('❌ ' + e.message);
    document.getElementById('stat').textContent = 'Lỗi: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '🚀 Tạo loadstring';
}

function cp(id){
  const t = document.getElementById(id).textContent;
  navigator.clipboard.writeText(t).then(() => toast('Đã copy!'));
}
function openGist(){
  if(currentGist) window.open(currentGist, '_blank');
}

document.getElementById('code').addEventListener('input', updateSize);
updateTokenInfo();
renderHistory();
</script>
